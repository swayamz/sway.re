<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timers - Swayre</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            background: #1a1a1a;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 800px;
            width: 100%;
        }
        h1 {
            text-align: center;
            color: #4CAF50;
            margin-bottom: 40px;
        }
        .timer {
            background: #2a2a2a;
            border-radius: 12px;
            padding: 30px;
            text-align: center;
            margin-bottom: 20px;
        }
        .time-display {
            font-size: 3rem;
            font-weight: bold;
            margin: 20px 0;
            font-family: 'Courier New', monospace;
        }
        button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 12px 24px;
            margin: 0 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background: #45a049;
        }
        button:disabled {
            background: #666;
            cursor: not-allowed;
        }
        .footer {
            margin-top: auto;
            text-align: center;
            color: #888;
            padding: 20px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Timer App</h1>
        
        <div class="timer">
            <h2>Stopwatch</h2>
            <div class="time-display" id="stopwatch">00:00:00</div>
            <button onclick="startStopwatch()">Start</button>
            <button onclick="stopStopwatch()">Stop</button>
            <button onclick="resetStopwatch()">Reset</button>
        </div>

        <div class="timer">
            <h2>Countdown Timer</h2>
            <input type="number" id="minutes" placeholder="Minutes" min="0" max="60" style="padding: 8px; margin: 10px; background: #333; color: #fff; border: 1px solid #555; border-radius: 4px;">
            <input type="number" id="seconds" placeholder="Seconds" min="0" max="59" style="padding: 8px; margin: 10px; background: #333; color: #fff; border: 1px solid #555; border-radius: 4px;">
            <div class="time-display" id="countdown">00:00</div>
            <button onclick="startCountdown()">Start</button>
            <button onclick="stopCountdown()">Stop</button>
            <button onclick="resetCountdown()">Reset</button>
        </div>
    </div>

    <div class="footer">
        <p>Part of <strong>sway.re</strong> - A collection of useful tools</p>
    </div>

    <script>
        let stopwatchInterval;
        let countdownInterval;
        let stopwatchTime = 0;
        let countdownTime = 0;

        function formatTime(seconds) {
            const hours = Math.floor(seconds / 3600);
            const minutes = Math.floor((seconds % 3600) / 60);
            const secs = seconds % 60;
            
            if (hours > 0) {
                return `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            }
            return `${minutes.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        function startStopwatch() {
            if (!stopwatchInterval) {
                stopwatchInterval = setInterval(() => {
                    stopwatchTime++;
                    document.getElementById('stopwatch').textContent = formatTime(stopwatchTime);
                }, 1000);
            }
        }

        function stopStopwatch() {
            clearInterval(stopwatchInterval);
            stopwatchInterval = null;
        }

        function resetStopwatch() {
            stopStopwatch();
            stopwatchTime = 0;
            document.getElementById('stopwatch').textContent = '00:00:00';
        }

        function startCountdown() {
            const minutes = parseInt(document.getElementById('minutes').value) || 0;
            const seconds = parseInt(document.getElementById('seconds').value) || 0;
            
            if (!countdownInterval && (minutes > 0 || seconds > 0)) {
                countdownTime = minutes * 60 + seconds;
                countdownInterval = setInterval(() => {
                    if (countdownTime <= 0) {
                        stopCountdown();
                        alert('Time\'s up!');
                        return;
                    }
                    countdownTime--;
                    document.getElementById('countdown').textContent = formatTime(countdownTime);
                }, 1000);
            }
        }

        function stopCountdown() {
            clearInterval(countdownInterval);
            countdownInterval = null;
        }

        function resetCountdown() {
            stopCountdown();
            countdownTime = 0;
            document.getElementById('countdown').textContent = '00:00';
            document.getElementById('minutes').value = '';
            document.getElementById('seconds').value = '';
        }
    </script>
</body>
</html>
