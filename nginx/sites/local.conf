# Local development configuration
# Use localhost and direct ports for easy testing

# Main site - localhost
server {
    listen 80 default_server;
    server_name localhost;

    location / {
        return 200 '<h1>Sway Local Development</h1><p><a href="http://timers.localhost">Timers App</a></p><p>Direct access: <a href="http://localhost:3001">Timers on :3001</a></p>';
        add_header Content-Type text/html;
    }

    location /health {
        return 200 'OK';
        add_header Content-Type text/plain;
    }
}

# Timers subdomain - timers.localhost
server {
    listen 80;
    server_name timers.localhost;

    location / {
        proxy_pass http://sway-timers-local:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket support for development
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Development-friendly settings
        proxy_buffering off;
        proxy_cache off;
    }

    location /health {
        proxy_pass http://sway-timers-local:3000/health;
    }
}