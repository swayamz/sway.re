# Main domain - sway.re
server {
    listen 80;
    server_name sway.re;

    # Health check endpoint
    location /health {
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # Serve a simple landing page for the main domain
    location / {
        return 200 '<!DOCTYPE html><html><head><title>sway.re</title></head></html>';
        add_header Content-Type text/html;
    }
}

# Timers subdomain - timers.sway.re
server {
    listen 80;
    server_name timers.sway.re;

    location / {
        proxy_pass http://sway-timers:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Timeout settings for production
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Security headers
        proxy_hide_header X-Powered-By;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-XSS-Protection "1; mode=block" always;
        
        # Rate limiting (apply to specific endpoints if needed)
        # limit_req zone=api burst=20 nodelay;
    }
    
    # Health check for load balancer
    location /health {
        proxy_pass http://sway-timers:3000/api/health;
        proxy_set_header Host $host;
    }
}

server {
    listen 443 ssl http2;
    server_name sway.re;

    ssl_certificate /etc/nginx/ssl/sway.re.crt;
    ssl_certificate_key /etc/nginx/ssl/sway.re.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-GCM-SHA256;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
     }
}

